---
pipeline:
  id: wp3_hg
  name: poirot_rd_wgs
  assay: rd_wgs
  genome_build: GRCh38

entrypoints:
  analysis: workflow/Snakefile
  references: null

layout:
  local_rules_dir: workflow/rules
  local_scripts_dir: workflow/scripts
  schemas_dir: workflow/schemas
  report: report/workflow.rst

rule_groups:
  common: workflow/rules/common.smk
  variant_annotation: workflow/rules/add_ref_to_vcf.smk
  concat_vcfs: workflow/rules/concat_vcfs.smk
  coverage: workflow/rules/coverage.smk
  str_bed: workflow/rules/extract_str_bed.smk
  par_filtering: workflow/rules/filter_par_dups.smk
  mitochondrial_fixup: workflow/rules/fix_mt_gt.smk
  peddy: workflow/rules/peddy.smk
  cnv_aed_export: workflow/rules/vcf_to_aed.smk

hydra_modules:
  source: config.modules
  loader: hydra_genetics.utils.misc.get_module_snakefile
  local_module_root_config_key: hydra_local_path
  modules:
    - alignment
    - annotation
    - cnv_sv
    - compression
    - filtering
    - misc
    - mitochondrial
    - parabricks
    - prealignment
    - qc
    - snv_indels

scripts:
  pipeline_specific:
    - workflow/scripts/cnvpytor_vcf_to_aed.py
    - workflow/scripts/extract_str_bed.py
    - workflow/scripts/filter_bed_cnvs.py
    - workflow/scripts/fix_mt_gt.py
  shared_report_candidates:
    - workflow/scripts/create_peddy_fam.py
    - workflow/scripts/create_peddy_mqc_config.py
  shared_tool_candidates:
    - workflow/scripts/ref_vcf.py
  tested_scripts:
    - workflow/scripts/test_filter_bed_cnvs.py
    - workflow/scripts/test_fix_mt_gt.py

harmonization_notes:
  - Keep WGS-specific STR, mitochondrial, and CNV export logic local until it has a second pipeline user.
  - Peddy report helpers overlap with Hastings and are candidates for hydra-genetics/report.
  - Reference file names should come from the common cgu/library layout, not cluster-specific workflow logic.
